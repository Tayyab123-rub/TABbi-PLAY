<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TABbi PLAY</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        serene: {
                            50: '#f4f8f7',
                            100: '#e8f0ee',
                            200: '#d1e2dd',
                            300: '#a3c5bc',
                            400: '#75a89b',
                            500: '#4d8b7d',
                            600: '#3a6f63',
                            900: '#1a332d'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        h1, h2, h3, .brand-font {
            font-family: 'Outfit', sans-serif;
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Splash Fade Out */
        #splash-screen {
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
        }
        .splash-fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* 4D Background Mesh Flow */
        .mesh-bg {
            background-color: #f4f8f7;
            background-image: 
                radial-gradient(at 0% 0%, rgba(163, 197, 188, 0.35) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(209, 226, 221, 0.4) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(226, 232, 240, 0.5) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(117, 168, 155, 0.3) 0px, transparent 50%);
            background-size: 180% 180%;
            animation: meshFlow 14s ease infinite alternate;
        }

        @keyframes meshFlow {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 100%; }
        }

        /* Glassmorphism 3D Cards */
        .glass-card-3d {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 25px -10px rgba(77, 139, 125, 0.1);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card-3d:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 35px -10px rgba(77, 139, 125, 0.2);
        }

        /* Peaceful Logo Halo */
        .peace-halo {
            box-shadow: 0 0 25px rgba(117, 168, 155, 0.35);
            animation: pulseHalo 4s ease-in-out infinite;
        }

        @keyframes pulseHalo {
            0%, 100% { box-shadow: 0 0 20px rgba(117, 168, 155, 0.25); transform: scale(1); }
            50% { box-shadow: 0 0 35px rgba(117, 168, 155, 0.45); transform: scale(1.02); }
        }

        /* 3D Vinyl Reel Animation */
        .perspective-container { perspective: 1000px; }
        .vinyl-3d {
            animation: rotate3dVinyl 10s linear infinite;
            background: radial-gradient(circle, #2d3748 0%, #1a202c 40%, #4a5568 43%, #1a202c 46%, #0f172a 100%);
        }

        @keyframes rotate3dVinyl {
            0% { transform: rotateY(12deg) rotateX(8deg) rotate(0deg); }
            50% { transform: rotateY(-12deg) rotateX(-8deg) rotate(180deg); }
            100% { transform: rotateY(12deg) rotateX(8deg) rotate(360deg); }
        }
    </style>
</head>
<body id="app-body" class="mesh-bg text-slate-800 min-h-screen flex flex-col md:flex-row transition-colors duration-500 overflow-x-hidden relative">

    <!-- Splash Screen -->
    <div id="splash-screen" class="fixed inset-0 z-50 bg-serene-50/95 backdrop-blur-2xl flex flex-col items-center justify-between p-8 text-slate-800">
        <div></div>
        
        <div class="flex flex-col items-center gap-6 text-center">
            <div class="relative w-24 h-24 rounded-3xl bg-white border border-white p-2 flex items-center justify-center shadow-xl peace-halo">
                <div class="w-full h-full rounded-2xl border border-serene-300 flex items-center justify-center bg-serene-50">
                    <i class="fa-solid fa-spa text-4xl text-serene-500"></i>
                </div>
            </div>

            <div class="space-y-2">
                <h1 class="text-4xl md:text-5xl font-light tracking-widest text-slate-800 brand-font">
                    TABbi<span class="font-semibold text-serene-500">PLAY</span>
                </h1>
                <p class="text-xs uppercase tracking-widest text-serene-600 font-semibold bg-white/80 px-4 py-1.5 rounded-full border border-serene-200 shadow-sm">
                    Music Player
                </p>
            </div>
            
            <div class="w-40 h-1 bg-serene-200/60 rounded-full overflow-hidden mt-2">
                <div class="w-full h-full bg-serene-400 animate-pulse"></div>
            </div>
        </div>

        <div class="flex items-center gap-2 text-xs font-medium text-slate-400">
            <span>Powered by</span>
            <span class="text-serene-600 font-semibold flex items-center gap-1.5 bg-white border border-slate-100 px-3.5 py-1.5 rounded-full shadow-sm">
                <i class="fa-solid fa-music text-serene-400"></i> Netlify
            </span>
        </div>
    </div>

    <!-- Mobile Overlay -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/20 backdrop-blur-xs z-30 hidden md:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-72 bg-white/70 dark:bg-slate-900/80 backdrop-blur-2xl border-r border-white/80 p-6 flex flex-col justify-between transition-transform duration-400 -translate-x-full md:translate-x-0 shadow-xl md:shadow-none">
        <div class="space-y-8">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-2xl bg-serene-100 border border-white flex items-center justify-center text-serene-500 text-xl shadow-sm">
                        <i class="fa-solid fa-spa"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold tracking-wider text-slate-800 dark:text-white brand-font">TABbi Play</h1>
                        <p class="text-[10px] text-serene-600 font-semibold tracking-widest uppercase">Music Player</p>
                    </div>
                </div>
                <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-slate-600 text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-4">
                <p class="text-[11px] font-bold uppercase tracking-widest text-slate-400 px-1">Settings</p>

                <div class="flex items-center justify-between p-3.5 rounded-2xl bg-white/80 dark:bg-slate-800/50 border border-white dark:border-slate-700/50 shadow-sm">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-circle-half-stroke text-serene-500 text-sm"></i>
                        <span class="text-xs font-semibold text-slate-700 dark:text-slate-200">Dark Mode</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="dark-toggle" onchange="toggleTheme()" class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-serene-500"></div>
                    </label>
                </div>

                <div class="flex items-center justify-between p-3.5 rounded-2xl bg-white/80 dark:bg-slate-800/50 border border-white dark:border-slate-700/50 shadow-sm">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-compact-disc text-serene-500 text-sm"></i>
                        <span class="text-xs font-semibold text-slate-700 dark:text-slate-200">3D Vinyl Mode</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="poster-toggle" onchange="togglePosters()" class="sr-only peer">
                        <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-serene-500"></div>
                    </label>
                </div>
            </div>
        </div>

        <div class="pt-6 border-t border-slate-200/60 dark:border-slate-800">
            <div class="p-4 rounded-2xl bg-white/80 dark:bg-slate-800/50 border border-white dark:border-slate-700 text-slate-600 dark:text-slate-300 shadow-sm">
                <p class="text-xs font-bold text-serene-600">TABbi PLAY</p>
                <p class="text-[10px] text-slate-400 mt-0.5">iTunes Official Audio Streams</p>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-8 flex flex-col gap-8 z-10">
        
        <header class="flex items-center justify-between bg-white/70 dark:bg-slate-900/60 backdrop-blur-2xl border border-white dark:border-slate-800 p-4 rounded-3xl shadow-sm">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="w-10 h-10 rounded-2xl bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center hover:bg-slate-50 transition active:scale-95 md:hidden shadow-sm">
                    <i class="fa-solid fa-bars text-base"></i>
                </button>
                <div>
                    <h2 class="text-lg md:text-2xl font-bold tracking-tight text-slate-800 dark:text-white brand-font">TABbi PLAY</h2>
                    <p class="text-xs text-serene-600 font-medium">MUSIC PLAYER</p>
                </div>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="flex items-center gap-3 bg-white/80 dark:bg-slate-900/80 backdrop-blur-2xl p-2.5 pl-5 rounded-2xl border border-white dark:border-slate-800 shadow-sm transition">
            <i class="fa-solid fa-magnifying-glass text-serene-400 text-base"></i>
            <input type="text" id="search-input" placeholder="Search track, artist, song..." class="w-full bg-transparent outline-none text-sm md:text-base font-medium text-slate-800 dark:text-white placeholder-slate-400">
            <button onclick="searchSongs()" class="bg-serene-500 hover:bg-serene-600 text-white text-xs md:text-sm px-6 py-3 rounded-xl font-bold transition active:scale-95 shadow-sm">SEARCH</button>
        </div>

        <!-- Slider -->
        <section class="space-y-4">
            <div class="flex items-center justify-between px-1">
                <h3 class="text-xs font-bold uppercase tracking-widest text-serene-600 dark:text-serene-400 flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Featured Collection
                </h3>

                <div class="flex gap-2">
                    <button onclick="scrollSlider(-280)" class="w-8 h-8 rounded-xl bg-white dark:bg-slate-800 border border-white dark:border-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center hover:bg-slate-50 active:scale-95 transition shadow-sm"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                    <button onclick="scrollSlider(280)" class="w-8 h-8 rounded-xl bg-white dark:bg-slate-800 border border-white dark:border-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center hover:bg-slate-50 active:scale-95 transition shadow-sm"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                </div>
            </div>

            <div id="slider-container" class="flex gap-5 overflow-x-auto hide-scrollbar pb-3 scroll-smooth"></div>

            <div class="w-full bg-slate-200/60 dark:bg-slate-800 h-1 rounded-full overflow-hidden">
                <div id="slider-bar" class="bg-serene-400 h-full w-0 transition-all duration-200"></div>
            </div>
        </section>

        <!-- Track List -->
        <section class="flex-1 space-y-4">
            <h3 class="text-xs font-bold uppercase tracking-widest text-slate-400 px-1">Audio Playlist</h3>
            <div id="song-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>

    </main>

    <!-- Player -->
    <div id="player-modal" class="fixed inset-x-0 bottom-0 bg-white/90 dark:bg-slate-900/95 border-t border-white dark:border-slate-800 backdrop-blur-2xl z-50 p-4 md:p-5 transition-transform duration-500 translate-y-full shadow-2xl">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-4 overflow-hidden">
                <img id="player-img" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=200&q=80" class="w-12 h-12 md:w-14 md:h-14 rounded-2xl object-cover border border-white shadow-sm">
                <div class="overflow-hidden">
                    <p id="player-title" class="text-sm md:text-base font-bold truncate text-slate-800 dark:text-white">Select a song...</p>
                    <p id="player-artist" class="text-xs text-serene-600 dark:text-serene-400 truncate mt-0.5">Artist</p>
                </div>
            </div>

            <div class="flex items-center gap-3 md:gap-4">
                <button id="speed-btn" onclick="toggleSpeed()" class="text-xs font-semibold text-serene-600 dark:text-serene-400 bg-serene-50 dark:bg-slate-800 border border-serene-100 dark:border-slate-700 px-3 py-2 rounded-xl">1x</button>
                <button onclick="togglePlayPause()" class="w-11 h-11 md:w-12 md:h-12 rounded-full bg-serene-500 hover:bg-serene-600 text-white flex items-center justify-center text-base font-black shadow-md active:scale-95 transition">
                    <i id="play-icon" class="fa-solid fa-play ml-0.5"></i>
                    <i id="pause-icon" class="fa-solid fa-pause hidden"></i>
                </button>
                <a id="download-btn" target="_blank" download class="w-9 h-9 md:w-10 md:h-10 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200/60 dark:border-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center hover:bg-slate-200 transition" title="Download Audio">
                    <i class="fa-solid fa-download text-xs"></i>
                </a>
                <button onclick="closePlayer()" class="text-slate-400 hover:text-slate-600 p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
        </div>
    </div>

    <audio id="audio-player" crossorigin="anonymous" preload="auto"></audio>

    <script>
        const splashScreen = document.getElementById("splash-screen");
        const songList = document.getElementById("song-list");
        const sliderContainer = document.getElementById("slider-container");
        const sliderBar = document.getElementById("slider-bar");
        const searchInput = document.getElementById("search-input");
        const playerModal = document.getElementById("player-modal");
        const audio = document.getElementById("audio-player");
        const appBody = document.getElementById("app-body");
        const sidebar = document.getElementById("sidebar");
        const sidebarOverlay = document.getElementById("sidebar-overlay");

        const playerTitle = document.getElementById("player-title");
        const playerArtist = document.getElementById("player-artist");
        const playerImg = document.getElementById("player-img");
        const playIcon = document.getElementById("play-icon");
        const pauseIcon = document.getElementById("pause-icon");
        const speedBtn = document.getElementById("speed-btn");
        const downloadBtn = document.getElementById("download-btn");
        const darkToggle = document.getElementById("dark-toggle");
        const posterToggle = document.getElementById("poster-toggle");

        let tracks = [];
        let currentIndex = 0;
        let isDark = false;
        let hidePosters = false;

        setTimeout(() => {
            splashScreen.classList.add("splash-fade-out");
        }, 1500);

        function toggleSidebar() {
            sidebar.classList.toggle("-translate-x-full");
            sidebarOverlay.classList.toggle("hidden");
        }

        function toggleTheme() {
            isDark = !isDark;
            darkToggle.checked = isDark;
            if (isDark) {
                document.documentElement.classList.add("dark");
                appBody.className = "bg-slate-950 text-slate-100 min-h-screen flex flex-col md:flex-row transition-colors duration-500 overflow-x-hidden relative";
            } else {
                document.documentElement.classList.remove("dark");
                appBody.className = "mesh-bg text-slate-800 min-h-screen flex flex-col md:flex-row transition-colors duration-500 overflow-x-hidden relative";
            }
        }

        function togglePosters() {
            hidePosters = posterToggle.checked;
            renderSlider();
        }

        sliderContainer.addEventListener("scroll", () => {
            const maxScroll = sliderContainer.scrollWidth - sliderContainer.clientWidth;
            if (maxScroll > 0) {
                sliderBar.style.width = `${(sliderContainer.scrollLeft / maxScroll) * 100}%`;
            }
        });

        function scrollSlider(amount) {
            sliderContainer.scrollBy({ left: amount, behavior: 'smooth' });
        }

        function searchSongs() {
            const query = searchInput.value.trim() || "Atif Aslam";
            songList.innerHTML = `<p class="col-span-full text-center text-serene-600 font-medium text-xs my-10">Fetching songs...</p>`;

            const oldScript = document.getElementById("itunes-jsonp");
            if (oldScript) oldScript.remove();

            window.handleSongsResponse = function(data) {
                if (!data.results || data.results.length === 0) {
                    songList.innerHTML = `<p class="col-span-full text-center text-serene-600 font-medium text-xs my-10">No songs found!</p>`;
                    return;
                }
                tracks = data.results.filter(song => song.previewUrl);
                renderSlider();
                renderTrackList();
                sliderBar.style.width = "0%";
            };

            const script = document.createElement("script");
            script.id = "itunes-jsonp";
            script.src = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=30&callback=handleSongsResponse`;
            document.body.appendChild(script);
        }

        function renderSlider() {
            sliderContainer.innerHTML = "";
            tracks.slice(0, 10).forEach((song, idx) => {
                const slide = document.createElement("div");
                slide.className = "flex-shrink-0 w-44 md:w-52 glass-card-3d p-3.5 rounded-3xl cursor-pointer group";

                if (hidePosters) {
                    // Jab toggle ON ho (Show Posters off / Vinyl Mode active), toh vinyl ke center mein song poster show karein
                    slide.innerHTML = `
                        <div class="perspective-container w-full h-40 md:h-48 rounded-2xl mb-3 bg-slate-100 dark:bg-slate-800 flex items-center justify-center overflow-hidden border border-white relative">
                            <div class="vinyl-3d w-28 h-28 rounded-full flex items-center justify-center relative shadow-md">
                                <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-serene-300 flex items-center justify-center absolute">
                                    <img src="${song.artworkUrl100}" class="w-full h-full object-cover">
                                </div>
                            </div>
                        </div>
                        <h4 class="text-xs md:text-sm font-bold truncate text-slate-800 dark:text-white">${song.trackName}</h4>
                        <p class="text-[11px] text-serene-600 dark:text-serene-400 truncate mt-0.5">${song.artistName}</p>
                    `;
                } else {
                    // Normal poster view
                    slide.innerHTML = `
                        <div class="relative overflow-hidden rounded-2xl mb-3 shadow-xs">
                            <img src="${song.artworkUrl100.replace('100x100bb', '400x400bb')}" class="w-full h-40 md:h-48 object-cover group-hover:scale-105 transition duration-500">
                            <div class="absolute inset-0 bg-slate-900/20 opacity-0 group-hover:opacity-100 flex items-center justify-center transition backdrop-blur-xs">
                                <i class="fa-solid fa-circle-play text-white text-4xl drop-shadow-md"></i>
                            </div>
                        </div>
                        <h4 class="text-xs md:text-sm font-bold truncate text-slate-800 dark:text-white">${song.trackName}</h4>
                        <p class="text-[11px] text-serene-600 dark:text-serene-400 truncate mt-0.5">${song.artistName}</p>
                    `;
                }

                slide.onclick = () => openPlayer(idx);
                sliderContainer.appendChild(slide);
            });
        }

        function renderTrackList() {
            songList.innerHTML = "";
            tracks.forEach((song, index) => {
                const card = document.createElement("div");
                card.className = "glass-card-3d p-3.5 rounded-3xl flex items-center justify-between cursor-pointer hover:border-serene-300 transition";

                card.innerHTML = `
                    <div class="flex items-center gap-4 overflow-hidden">
                        <img src="${song.artworkUrl100}" class="w-12 h-12 md:w-14 md:h-14 rounded-2xl object-cover border border-white dark:border-slate-700">
                        <div class="overflow-hidden">
                            <h4 class="text-sm font-bold truncate text-slate-800 dark:text-white">${song.trackName}</h4>
                            <p class="text-xs text-serene-600 dark:text-serene-400 truncate mt-0.5">${song.artistName}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <a href="${song.previewUrl}" target="_blank" download onclick="event.stopPropagation();" class="p-2 text-slate-400 hover:text-slate-600 transition" title="Download Audio">
                            <i class="fa-solid fa-download"></i>
                        </a>
                        <i class="fa-solid fa-circle-play text-serene-500 text-3xl"></i>
                    </div>
                `;

                card.onclick = () => openPlayer(index);
                songList.appendChild(card);
            });
        }

        searchInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") searchSongs();
        });

        function openPlayer(index) {
            currentIndex = index;
            const song = tracks[currentIndex];
            if (!song || !song.previewUrl) return;

            audio.pause();
            
            let streamUrl = song.previewUrl.replace(/^http:/, 'https:');
            const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(streamUrl);

            playerTitle.innerText = song.trackName;
            playerArtist.innerText = song.artistName;
            playerImg.src = song.artworkUrl100.replace('100x100bb', '400x400bb');
            downloadBtn.href = streamUrl;

            playerModal.classList.remove("translate-y-full");

            audio.src = streamUrl;
            audio.load();

            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    audio.src = proxyUrl;
                    audio.load();
                    audio.play().catch(e => console.error("Audio playback error:", e));
                });
            }
        }

        function closePlayer() {
            playerModal.classList.add("translate-y-full");
            audio.pause();
        }

        function togglePlayPause() {
            if (audio.paused) {
                audio.play().catch(e => console.warn(e));
            } else {
                audio.pause();
            }
        }

        function toggleSpeed() {
            audio.playbackRate = (audio.playbackRate === 1) ? 1.5 : (audio.playbackRate === 1.5 ? 2 : 1);
            speedBtn.innerText = `${audio.playbackRate}x`;
        }

        audio.onplay = () => {
            playIcon.classList.add("hidden");
            pauseIcon.classList.remove("hidden");
        };

        audio.onpause = () => {
            playIcon.classList.remove("hidden");
            pauseIcon.classList.add("hidden");
        };

        // Initial Load
        searchInput.value = "Atif Aslam";
        searchSongs();
    </script>
</body>
</html>
